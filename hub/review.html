<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选记忆（__COUNT__）</title>
<script>
/* 界面语言（和控制台共用 localStorage 的 am.lang，没存过就看浏览器语言）。审批页的链接本身就是凭证，打开它的人不一定取得到 /console/ 下的脚本，
   所以这里自带一份很小的词典，不依赖 console-i18n.js。 */
(function () {
  let l = null; try { l = localStorage.getItem('am.lang'); } catch (e) { /* 读不到就按浏览器语言 */ }
  if (l !== 'zh' && l !== 'en') l = String(navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  if (l !== 'en') return;
  document.documentElement.lang = 'en';
  const D = { '候选记忆': 'Candidate memories', '全部保留': 'Keep all', '没有待审的候选': 'No candidates to review', '展开': 'Expand', '收起': 'Collapse', '保留': 'Keep', '不要': 'Discard',
    '已保留': 'Kept', '不要了': 'Discarded', '没成功：': 'Failed: ', '偏好': 'Preference', '反馈': 'Feedback', '决定': 'Decision', '现状': 'Status', '坑': 'Pitfall', '事实': 'Fact', '参考': 'Reference' };
  const T = (s) => {
    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s); const k = m[2];
    if (D[k] !== undefined) return m[1] + D[k] + m[3];
    let r;
    if ((r = /^候选记忆（(\d+)）$/.exec(k))) return `${m[1]}Candidate memories (${r[1]})${m[3]}`;
    if ((r = /^（(\d+)）$/.exec(k))) return `${m[1]}(${r[1]})${m[3]}`;
    if ((r = /^从会话里自动抽出来的，(\d+) 天内不处理会自动保留。$/.exec(k))) return `${m[1]}Extracted automatically from sessions; kept automatically if not handled within ${r[1]} days.${m[3]}`;
    if (k.indexOf('没成功：') === 0) return m[1] + 'Failed: ' + k.slice(4) + m[3];
    return s;
  };
  const walk = (n) => { if (n.nodeType === 3) { const t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; } else if (n.nodeType === 1 && !/^(SCRIPT|STYLE)$/.test(n.tagName)) n.childNodes.forEach(walk); };
  const go = () => {
    walk(document.documentElement);
    new MutationObserver((rs) => { for (const r of rs) { if (r.type === 'characterData') walk(r.target); else r.addedNodes.forEach(walk); } }).observe(document.documentElement, { subtree: true, childList: true, characterData: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  const a = window.alert; window.alert = (m) => a.call(window, T(String(m)));
})();
</script>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --ok:#1a7f37; --no:#cf222e; --bg:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:1; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header .hint { color:var(--muted); font-size:13px; width:100%; }
  main { max-width:860px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; border:1px solid var(--line); border-radius:10px; padding:0 8px; margin-right:6px; font-size:12px; color:var(--fg); }
  .title { font-weight:600; margin:6px 0; }
  .body { white-space:pre-wrap; font-size:14px; max-height:7.5em; overflow:hidden; }
  .body.open { max-height:none; }
  .more { color:var(--muted); font-size:13px; cursor:pointer; user-select:none; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  button { font:inherit; border-radius:6px; border:1px solid var(--line); background:#fff; padding:6px 16px; cursor:pointer; }
  button.keep { border-color:var(--ok); color:var(--ok); }
  button.drop { border-color:var(--no); color:var(--no); }
  button.all { background:var(--ok); color:#fff; border-color:var(--ok); }
  button:disabled { opacity:.5; cursor:default; }
  .done { opacity:.45; }
  .empty { text-align:center; color:var(--muted); padding:48px 0; }
</style>
</head>
<body>
<header>
  <h1>候选记忆 <span id="count"></span></h1>
  <button class="all" id="all">全部保留</button>
  <div class="hint" id="hint"></div>
</header>
<main id="list"></main>
<script>
const DATA = __DATA__;
const list = document.getElementById('list');
const left = () => DATA.items.filter((x) => !x.done);
function render() {
  document.getElementById('count').textContent = `（${left().length}）`;
  document.getElementById('hint').textContent = `从会话里自动抽出来的，${DATA.autoDays} 天内不处理会自动保留。`;
  document.getElementById('all').disabled = !left().length;
  if (!DATA.items.length) { list.innerHTML = '<div class="empty">没有待审的候选</div>'; return; }
  list.innerHTML = '';
  for (const it of DATA.items) {
    const el = document.createElement('div');
    el.className = 'card' + (it.done ? ' done' : '');
    el.innerHTML = `
      <div class="meta"><span class="tag"></span><span class="tag proj"></span><span class="from"></span></div>
      <div class="title"></div>
      <div class="body"></div>
      <div class="more">展开</div>
      <div class="actions"><button class="keep">保留</button><button class="drop">不要</button><span class="meta state"></span></div>`;
    el.querySelector('.tag').textContent = it.type;
    const proj = el.querySelector('.proj');
    if (it.project) proj.textContent = it.project; else proj.remove();
    el.querySelector('.from').textContent = `${it.from} · ${it.created}`;
    el.querySelector('.title').textContent = it.title;
    const body = el.querySelector('.body');
    body.textContent = it.body;
    el.querySelector('.more').onclick = (ev) => { body.classList.toggle('open'); ev.target.textContent = body.classList.contains('open') ? '收起' : '展开'; };
    const btns = el.querySelectorAll('button');
    if (it.done) { btns.forEach((b) => b.disabled = true); el.querySelector('.state').textContent = it.done; }
    el.querySelector('.keep').onclick = () => decide([it], 'approve');
    el.querySelector('.drop').onclick = () => decide([it], 'reject');
    list.appendChild(el);
  }
}
async function decide(items, action) {
  const res = await fetch(location.pathname.replace(/\/$/, '') + '/decide', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ids: items.map((x) => x.id), action }),
  });
  if (!res.ok) { alert('没成功：' + (await res.text())); return; }
  for (const it of items) it.done = action === 'approve' ? '已保留' : '不要了';
  render();
}
document.getElementById('all').onclick = () => decide(left(), 'approve');
render();
</script>
</body>
</html>
