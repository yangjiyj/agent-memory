<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-memory</title>
<script src="/console/console-i18n.js"></script>
<script src="/console/console-i18n-ui.js"></script>
<script src="/console/console-i18n-srv.js"></script>
<style>
  :root {
    color-scheme: dark;
    --surface: #0b1020;
    --panel: rgba(17, 25, 48, 0.72);
    --panel-line: rgba(110, 150, 255, 0.16);
    --text-primary: #e8ecf6;
    --text-secondary: #a3aecb;
    --text-muted: #6f7a99;
    --grid: rgba(148, 163, 184, 0.10);
    --glow: rgba(57, 135, 229, 0.35);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --other: #5b6478; --unwritten: #39425a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); color: var(--text-primary); }
  body {
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(57, 135, 229, 0.18), transparent 60%),
      radial-gradient(900px 500px at 95% 10%, rgba(144, 133, 233, 0.14), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(25, 158, 112, 0.10), transparent 60%),
      var(--surface);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    opacity: .55;
  }
  .wrap { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; padding: 22px 24px 48px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; font-weight: 700;
       background: linear-gradient(90deg, #e8ecf6, #86b6ef 55%, #9085e9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12.5px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #0ca30c; box-shadow: 0 0 10px #0ca30c; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  header a { color: var(--text-secondary); text-decoration: none; border: 1px solid var(--panel-line); padding: 5px 12px; border-radius: 8px; font-size: 13px; }
  header a:hover { color: var(--text-primary); border-color: rgba(134, 182, 239, .5); }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; backdrop-filter: blur(8px); }
  .kpi::after { content: ""; position: absolute; left: -40%; top: 0; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(134, 182, 239, .08), transparent); animation: sweep 6s infinite; }
  .kpi:nth-child(2)::after { animation-delay: 1s; } .kpi:nth-child(3)::after { animation-delay: 2s; } .kpi:nth-child(4)::after { animation-delay: 3s; } .kpi:nth-child(5)::after { animation-delay: 4s; } .kpi:nth-child(6)::after { animation-delay: 5s; }
  @keyframes sweep { to { left: 140%; } }
  .kpi .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px; text-shadow: 0 0 18px var(--glow); }
  .kpi .v small { font-size: 14px; color: var(--text-secondary); font-weight: 500; margin-left: 3px; text-shadow: none; }
  .kpi .l { color: var(--text-secondary); font-size: 12.5px; margin-top: 2px; }

  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 16px 18px 14px; margin-bottom: 14px; backdrop-filter: blur(8px);
           box-shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 20px 50px -30px rgba(57, 135, 229, .35); }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel h2::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(#86b6ef, #9085e9); box-shadow: 0 0 8px #3987e5; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .hint { color: var(--text-muted); font-size: 12px; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .row2 > .panel { margin-bottom: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .legend b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .daynav { display: flex; align-items: center; gap: 8px; }
  .daynav button { font: inherit; font-size: 13px; color: var(--text-primary); background: rgba(57, 135, 229, .12); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 11px; cursor: pointer; }
  .daynav button:hover { background: rgba(57, 135, 229, .25); }
  .daynav .d { font-size: 15px; font-weight: 600; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; margin-top: 12px; max-height: 440px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: rgba(134,182,239,.3) transparent; }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .55; }
  .card { border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 12px; background: rgba(11, 16, 32, .55); transition: border-color .2s, box-shadow .2s; }
  .card.hl { border-color: rgba(134, 182, 239, .7); box-shadow: 0 0 18px -4px var(--glow); }
  .card .t { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); }
  .card .t b { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .card .s { margin-top: 5px; font-size: 13.5px; color: var(--text-primary); }
  .card ul { margin: 6px 0 0; padding-left: 16px; color: var(--text-secondary); font-size: 12.5px; }
  .card .m { margin-top: 6px; font-size: 11.5px; color: var(--text-muted); }

  svg text { fill: var(--text-secondary); font-size: 11px; }
  .tip { position: fixed; z-index: 10; pointer-events: none; max-width: 380px; background: rgba(8, 12, 26, .96); border: 1px solid rgba(134, 182, 239, .35);
         border-radius: 10px; padding: 9px 11px; font-size: 12.5px; color: var(--text-primary); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 20px -6px var(--glow); opacity: 0; transition: opacity .12s; }
  .tip .h { font-weight: 600; margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tip .r b { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip .r em { font-style: normal; color: var(--text-primary); margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
  .bars .b { display: grid; grid-template-columns: 110px 1fr 46px; align-items: center; gap: 8px; margin: 7px 0; font-size: 12.5px; }
  .bars .b .n { color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
  .bars .b .track { height: 10px; background: rgba(255,255,255,.04); border-radius: 5px; overflow: hidden; }
  .bars .b .fill { height: 100%; border-radius: 0 5px 5px 0; width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 12px -2px currentColor; }
  .bars .b .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .row2.even { grid-template-columns: 1fr 1fr; }
  .row2.hero { grid-template-columns: 1.55fr 1fr; }
  #galaxy { width: 100%; height: 470px; display: block; cursor: grab; border-radius: 12px; background: radial-gradient(ellipse at center, rgba(57,135,229,.10), transparent 70%); }
  #galaxy:active { cursor: grabbing; }
  #live { width: 100%; height: 300px; display: block; }
  .livebar { display: flex; gap: 18px; align-items: baseline; margin: 2px 0 4px; }
  .livebar b { font-size: 24px; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px var(--glow); }
  .livebar span { color: var(--text-secondary); font-size: 12.5px; }
  .feed { max-height: 132px; overflow: hidden; font-size: 12.5px; mask-image: linear-gradient(#000 70%, transparent); }
  .feed div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(110,150,255,.08); animation: fin .4s; }
  .feed div i { font-style: normal; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .feed div em { font-style: normal; color: var(--text-secondary); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #sform { display: flex; gap: 6px; }
  #sq { font: inherit; font-size: 13px; width: 300px; color: var(--text-primary); background: rgba(11,16,32,.7); border: 1px solid var(--panel-line); border-radius: 8px; padding: 5px 10px; outline: none; }
  #sq:focus { border-color: rgba(217, 89, 38, .7); box-shadow: 0 0 12px -3px rgba(217, 89, 38, .7); }
  #sform button, .play { font: inherit; font-size: 13px; color: var(--text-primary); background: rgba(57, 135, 229, .14); border: 1px solid var(--panel-line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  #sform button:hover, .play:hover { background: rgba(57, 135, 229, .28); }
  .play.on { background: rgba(230, 103, 103, .22); border-color: rgba(230, 103, 103, .5); }
  #shint { margin: -4px 0 6px; }
  #shint a { color: #86b6ef; cursor: pointer; margin-left: 8px; }
  #calPanel { position: relative; }
  .replay { display: none; margin-top: 10px; background: rgba(8, 12, 26, .7); border: 1px solid rgba(134, 182, 239, .35); border-radius: 12px; padding: 10px 14px; box-shadow: 0 0 30px -8px var(--glow); }
  .replay.on { display: grid; grid-template-columns: 260px 1fr; gap: 4px 18px; align-items: center; animation: fin .3s; }
  @keyframes fin { from { opacity: 0; transform: translateY(6px); } }
  .replay #rLines { grid-column: 2; grid-row: 1 / span 2; }
  .replay .rd { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px var(--glow); }
  .replay .rk { color: var(--text-secondary); font-size: 12.5px; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .replay .ln { display: flex; gap: 7px; align-items: baseline; font-size: 12.5px; margin-top: 3px; }
  .replay .ln b { width: 8px; height: 8px; border-radius: 2px; flex: none; transform: translateY(-1px); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent; border: 1px solid var(--panel-line); border-radius: 999px; padding: 2px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chips button b { width: 8px; height: 8px; border-radius: 2px; }
  .chips button.on { color: var(--text-primary); background: rgba(57, 135, 229, .18); border-color: rgba(134, 182, 239, .5); }
  .ms { max-height: 420px; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: rgba(134,182,239,.3) transparent; }
  .ms .mon { position: sticky; top: 0; background: linear-gradient(rgba(17,25,48,.98), rgba(17,25,48,.9)); color: var(--text-secondary); font-size: 12px; padding: 4px 0; z-index: 1; }
  .ms .it { display: grid; grid-template-columns: 46px 14px 1fr; gap: 6px; padding: 5px 0; border-left: 1px solid rgba(134,182,239,.18); margin-left: 52px; padding-left: 12px; position: relative; font-size: 12.5px; }
  .ms .it .dt { position: absolute; left: -58px; top: 5px; width: 46px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ms .it .dot { position: absolute; left: -5px; top: 10px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .ms .it .tx { grid-column: 1 / -1; color: var(--text-primary); }
  .ms .it .tx em { font-style: normal; color: var(--text-muted); font-size: 11.5px; margin-left: 6px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .row2, .row2.even, .row2.hero { grid-template-columns: 1fr; } .replay.on { grid-template-columns: 1fr; } .replay #rLines { grid-column: 1; grid-row: auto; } }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

  header .hbar { display: flex; gap: 12px; align-items: center; }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 1px solid var(--panel-line); background: rgba(134,182,239,.18); cursor: pointer; transition: .2s; }
  .dots button.on { background: #86b6ef; box-shadow: 0 0 10px #3987e5; width: 22px; border-radius: 6px; }
  body.cruise .dots { display: flex; } body:not(.cruise) .dots { display: none; }
  body.cruise .scene { display: none; }
  body.cruise .scene.on { display: block; animation: fin .55s; }
  body.cruise .wrap { max-width: none; padding: 16px 26px 20px; }
  body.cruise #galaxy { height: calc(100vh - 340px); min-height: 360px; }
  body.cruise #live { height: calc(100vh - 560px); min-height: 220px; }
  body.cruise .feed { max-height: 160px; }
  body.cruise .cards { max-height: calc(100vh - 560px); min-height: 160px; }
  body.cruise .ms { max-height: calc(100vh - 420px); }
  #topo { display: block; width: 100%; height: 700px; border: 0; background: transparent; color-scheme: dark; }
  body.cruise #topo { height: calc(100vh - 216px); min-height: 610px; }
  body.cruise.on-topo .kpis { display: none; } /* 拓扑那一屏占满，中心节点上已经有这些数 */
</style>
</head>
<body class="cruise">
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <div>
      <h1>agent-memory</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hbar">
      <div class="dots" id="dots"></div>
      <button id="cruise" class="play">⏸ 暂停巡航</button>
      <button id="fs" class="play">⛶ 全屏</button>
      <a href="/console">返回控制台</a>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="scene">
    <div class="row2 hero">
      <section class="panel">
        <div class="ph"><h2>工作星系</h2></div>
        <div class="legend" id="galLegend"></div>
        <canvas id="galaxy"></canvas>
      </section>
      <section class="panel">
        <div class="ph"><h2>实时作战室</h2></div>
        <div class="livebar" id="liveBar"></div>
        <canvas id="live"></canvas>
        <div class="feed" id="feed"></div>
      </section>
    </div>
  </div>

  <div class="scene">
    <section class="panel">
      <div class="ph"><h2>实时拓扑</h2></div>
      <iframe id="topo" title="实时拓扑"></iframe>
    </section>
  </div>

  <div class="scene">
    <section class="panel" id="calPanel">
      <div class="ph">
        <h2>工作日历</h2>
        <div class="tools">
          <form id="sform" autocomplete="off"><input id="sq" placeholder="搜一个词，看哪些天做过：部署、登录页、2.9.20…"><button>点亮</button></form>
          <button id="play" class="play">▶ 时光回放</button>
        </div>
      </div>
      <div class="hint" id="shint"></div>
      <div id="cal"></div>
      <div class="replay" id="replay"><div class="rd" id="rDate"></div><div class="rk" id="rKpi"></div><div id="rLines"></div></div>
    </section>
  </div>

  <div class="scene">
    <section class="panel">
      <div class="ph">
        <h2>当天在做什么</h2>
        <div class="daynav"><button id="prev">‹ 前一天</button><span class="d" id="dayLabel">—</span><button id="next">后一天 ›</button><button id="today">今天</button></div>
      </div>
      <div class="legend" id="dayLegend"></div>
      <div id="lanes"></div>
      <div class="cards" id="cards"></div>
    </section>
  </div>

  <div class="scene">
    <div class="row2">
      <section class="panel">
        <div class="ph"><h2>项目河流</h2></div>
        <div class="legend" id="riverLegend"></div>
        <div id="river"></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>项目排行</h2></div>
        <div class="bars" id="rank"></div>
      </section>
    </div>
  </div>

  <div class="scene">
    <div class="row2 even">
      <section class="panel">
        <div class="ph"><h2>作息打卡</h2></div>
        <div class="chips" id="punchTools"></div>
        <div id="punch"></div>
        <div class="hint" id="punchNote" style="margin-top:6px"></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>大事记</h2><span class="hint" id="msCount"></span></div>
        <div class="chips" id="msChips"></div>
        <div class="ms" id="ms"></div>
      </section>
    </div>
  </div>

  <div class="scene">
    <section class="panel">
      <div class="ph"><h2>机器 → 智能体 → 项目</h2></div>
      <div id="sankey"></div>
    </section>
  </div>

  <div class="hint" id="foot" style="text-align:center;margin-top:8px"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = (id) => document.getElementById(id);
const SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7'].map((v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const OTHER = '#5b6478';
const UNWRITTEN = '#39425a';
const SEQ = ['#104281', '#184f95', '#256abf', '#3987e5', '#6da7ec', '#9ec5f4', '#cde2fb'];
let DEVICE = {}; // 设备显示名：中心 config.json 的 device_labels，如 { "my-laptop": "笔记本" }
const TOOL = { 'claude-code': 'Claude Code', codex: 'Codex', workbuddy: 'WorkBuddy', codebuddy: 'CodeBuddy', hermes: 'Hermes', openclaw: 'OpenClaw', opencode: 'OpenCode', gemini: 'Gemini', qwen: 'Qwen' };
const WEEK = '日一二三四五六';
const dev = (d) => DEVICE[d] || d;
const tool = (t) => TOOL[t] || t;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const tip = $('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e) {
  const w = tip.offsetWidth; const h = tip.offsetHeight;
  let x = e.clientX + 14; let y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
function hideTip() { tip.style.opacity = 0; }

const localDayOf = (ms) => new Date(ms + 8 * 3600e3).toISOString().slice(0, 10);
const todayStr = () => localDayOf(Date.now());
const addDays = (d, n) => new Date(Date.parse(`${d}T12:00:00Z`) + n * 86400e3).toISOString().slice(0, 10);
const wd = (d) => new Date(`${d}T12:00:00Z`).getUTCDay();
const minutesOf = (iso) => ((Date.parse(iso) + 8 * 3600e3) % 86400e3) / 60000;
const fmtHM = (iso) => new Date(Date.parse(iso) + 8 * 3600e3).toISOString().slice(11, 16);

let DATA = null;
let COLOR = {}; // 项目 → 颜色（按累计排名固定分配，筛选/换天都不变）
let TOP = [];
let currentDay = null;
const colorOf = (p) => COLOR[p] || (p === '未写日志' || !p ? UNWRITTEN : OTHER);

// ---------------- KPI ----------------
function countUp(node, target, fmt) {
  const t0 = performance.now(); const dur = 1400;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - k, 3);
    node.innerHTML = fmt(target * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderKpis() {
  const k = DATA.kpi;
  const items = [
    [k.sessions, (v) => Math.round(v).toLocaleString(), '个会话'],
    [k.messages, (v) => (window.AMI18n?.lang === 'en' ? `${(v / 1e3).toFixed(1)}<small>K</small>` : `${(v / 1e4).toFixed(1)}<small>万</small>`), '条你和智能体说的话'],
    [k.chars, (v) => `${(v / 1e6).toFixed(1)}<small>M 字</small>`, '对话原文（长期存档）'],
    [k.days, (v) => `${Math.round(v)}<small>天</small>`, '有工作日志的日子'],
    [DATA.memories.total, (v) => Math.round(v).toLocaleString(), '条有效记忆'],

      .sort((x, y) => pos[from].get(x.a).y - pos[from].get(y.a).y || pos[to].get(x.b).y - pos[to].get(y.b).y);
    for (const l of entries) {
      const s = pos[from].get(l.a); const t = pos[to].get(l.b); if (!s || !t) continue;
      const w = Math.max(1, l.v * k);

      const y1 = t.inY + w / 2; t.inY += w;

      const label = `${from === 0 ? dev(l.a) : tool(l.a)} → ${to === 1 ? tool(l.b) : l.b}`;
      p.addEventListener('mousemove', (e) => { p.setAttribute('stroke-opacity', 0.75); showTip(e, `<div class="h">${esc(label)}</div><div class="r">会话段<em>${l.v.toLocaleString()}</em></div>`); });
      p.addEventListener('mouseleave', () => { p.setAttribute('stroke-opacity', 0.32); hideTip(); });
    }
  };
  drawLinks(L1, 0, 1);
  drawLinks(L2, 1, 2);
  pos.forEach((m, ci) => {
    for (const [name, n] of m) {
      el('rect', { x: xs[ci], y: n.y, width: nodeW, height: n.h, rx: 3, fill: nodeColor(ci, name), style: 'filter:drop-shadow(0 0 6px rgba(134,182,239,.45))' }, svg);
      const lab = ci === 0 ? dev(name) : ci === 1 ? tool(name) : name;
      const t = el('text', { x: ci === 2 ? xs[ci] + nodeW + 8 : xs[ci] - 8, y: n.y + n.h / 2 + 4, 'text-anchor': ci === 2 ? 'start' : 'end', style: 'fill:var(--text-primary);font-size:12px' }, svg);
      t.textContent = `${lab}  `;

      if (ci === 1) { t.setAttribute('x', xs[ci] + nodeW + 8); t.setAttribute('text-anchor', 'start'); }
    }
  });
}

    hit.addEventListener('mousemove', (e) => showTip(e, `<div class="h">周${days[r]} ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00</div><div class="r">你发的消息<em>${n.toLocaleString()}</em></div><div class="r">占这个范围的<em>${((100 * n) / total).toFixed(1)}%</em></div>`));

// ---------------- 背景：缓慢漂移的星点和连线（纯装饰，标签页不可见时暂停） ----------------
(function stars() {
  const c = $('stars'); const g = c.getContext('2d');

    w = c.width = innerWidth * devicePixelRatio; h = c.height = innerHeight * devicePixelRatio;

        }

// ---------------- 工作星系（canvas 伪 3D：每个会话一颗星，按项目聚成旋涡星团） ----------------
const FITS = []; // 画布尺寸适配函数：场景切换后重新量
const GAL = { yaw: 0.6, pitch: 0.42, zoom: 1, drag: null, pts: [], proj: [], hover: -1, visible: true, labels: [] };
function initGalaxy(data) {
  const cv = $('galaxy'); const g = cv.getContext('2d');
  const clusters = [...TOP, '其他'];
  const groups = new Map(clusters.map((c) => [c, []]));
  for (const r of data.rows) groups.get(TOP.includes(r[1]) ? r[1] : '其他').push(r);
  const maxN = Math.max(...[...groups.values()].map((a) => a.length)) || 1;
  const gauss = () => { let u = 0; let v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  GAL.pts = []; GAL.labels = [];
  clusters.forEach((c, ci) => {
    const list = groups.get(c).sort((a, b) => String(a[4]).localeCompare(String(b[4])));
    const isCore = c === '其他';
    const a0 = (ci / (clusters.length - 1)) * Math.PI * 2;
    const R = isCore ? 0 : 400;
    const cx = Math.cos(a0) * R; const cz = Math.sin(a0) * R;
    const size = 34 + 100 * Math.sqrt(list.length / maxN);
    const color = isCore ? '#8b93a8' : colorOf(c);
    GAL.labels.push({ c, n: list.length, x: cx, y: -size * 0.35 - 18, z: cz, color });
    list.forEach((r, k) => {
      const t = list.length > 1 ? k / (list.length - 1) : 0;
      const arm = k % 2; const ang = Math.sqrt(t) * Math.PI * 3.2 + arm * Math.PI + a0;
      const rad = 6 + size * Math.sqrt(t) + gauss() * (3 + 6 * t);
      GAL.pts.push({ x: cx + Math.cos(ang) * rad + gauss() * 4, y: gauss() * (10 * (1 - t) + 3), z: cz + Math.sin(ang) * rad + gauss() * 4,
        color, s: 0.45 + Math.log2((r[5] || 1) + 1) * 0.2, r });
    });
  });
  $('galLegend').innerHTML = clusters.map((c) => `<span><b style="background:${c === '其他' ? '#8b93a8' : colorOf(c)}"></b>${esc(c)} ${groups.get(c).length}</span>`).join('');
  const bg = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.2, a: Math.random() * 0.6 + 0.2 }));
  const dpr = devicePixelRatio || 1;
  const fit = () => { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; };
  fit(); FITS.push(fit); addEventListener('resize', fit);
  new IntersectionObserver((es) => { GAL.visible = es[0].isIntersecting; }).observe(cv);
  const F = 900;
  const frame = () => {
    requestAnimationFrame(frame);
    if (!GAL.visible || document.hidden) return;
    if (!GAL.drag) GAL.yaw += 0.0018;
    const W = cv.width; const H = cv.height;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    for (const b of bg) { g.fillStyle = `rgba(205,226,251,${b.a * 0.5})`; g.beginPath(); g.arc(b.x * W, b.y * H, b.r * dpr, 0, 6.283); g.fill(); }
    const cy = Math.cos(GAL.yaw); const sy = Math.sin(GAL.yaw); const cp = Math.cos(GAL.pitch); const sp = Math.sin(GAL.pitch);
    const k = Math.min(W * 0.62, H) / 900 * GAL.zoom;
    const project = (p) => {
      const x1 = p.x * cy + p.z * sy; const z1 = -p.x * sy + p.z * cy;
      const y2 = p.y * cp - z1 * sp; const z2 = p.y * sp + z1 * cp;
      const sc = F / (F + z2) * k;
      return [W / 2 + x1 * sc, H * 0.46 + y2 * sc, sc, z2];
    };
    g.globalCompositeOperation = 'lighter';
    GAL.proj = new Array(GAL.pts.length);
    for (let i = 0; i < GAL.pts.length; i++) {
      const p = GAL.pts[i]; const [x, y, sc] = project(p);
      GAL.proj[i] = [x, y];
      const rr = p.s * sc * dpr * 1.6;
      g.globalAlpha = 0.07; g.fillStyle = p.color; g.beginPath(); g.arc(x, y, rr * 3.2, 0, 6.283); g.fill();
      g.globalAlpha = i === GAL.hover ? 1 : 0.75; g.beginPath(); g.arc(x, y, i === GAL.hover ? rr * 2.2 : rr, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.font = `${12 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`; g.textAlign = 'center';
    for (const l of GAL.labels) {
      const [x, y, sc] = project(l);
      g.fillStyle = 'rgba(232,236,246,.92)'; g.fillText(l.c, x, y - 6 * dpr);
      g.fillStyle = 'rgba(163,174,203,.75)'; g.font = `${10.5 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`; g.fillText(`${l.n} 个会话`, x, y + 8 * dpr);
      g.font = `${12 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      void sc;
    }
  };
  requestAnimationFrame(frame);
  const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; };
  cv.addEventListener('mousedown', (e) => { GAL.drag = { x: e.clientX, y: e.clientY, yaw: GAL.yaw, pitch: GAL.pitch, moved: false }; });
  addEventListener('mouseup', () => { setTimeout(() => { GAL.drag = null; }, 0); });
  cv.addEventListener('mousemove', (e) => {
    if (GAL.drag) {
      const dx = e.clientX - GAL.drag.x; const dy = e.clientY - GAL.drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) GAL.drag.moved = true;
      GAL.yaw = GAL.drag.yaw + dx * 0.006; GAL.pitch = Math.max(-1.3, Math.min(1.3, GAL.drag.pitch + dy * 0.004));
      hideTip(); return;
    }
    const [mx, my] = at(e); let best = -1; let bd = (9 * dpr) ** 2;
    for (let i = 0; i < GAL.proj.length; i++) { const q = GAL.proj[i]; if (!q) continue; const d = (q[0] - mx) ** 2 + (q[1] - my) ** 2; if (d < bd) { bd = d; best = i; } }
    GAL.hover = best;
    if (best < 0) { hideTip(); return; }
    const r = GAL.pts[best].r;
    showTip(e, `<div class="h">${esc(r[6] || '（无标题）')}</div><div class="r"><b style="background:${GAL.pts[best].color}"></b>${esc(r[1] || '其他')}<em>${esc(r[4])}</em></div><div class="r">${esc(dev(r[3]))} · ${esc(tool(r[2]))}<em>${r[5]} 条</em></div><div class="r" style="color:var(--text-muted)">点一下看这天</div>`);
  });
  cv.addEventListener('mouseleave', () => { GAL.hover = -1; hideTip(); });
  cv.addEventListener('click', (e) => { if (GAL.drag?.moved) return; if (GAL.hover >= 0) { const r = GAL.pts[GAL.hover].r; if (r[4]) loadDay(r[4], true); } void e; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); GAL.zoom = Math.max(0.5, Math.min(3, GAL.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); }, { passive: false });
}

// ---------------- 实时作战室：中心 + 各台机器，正在干活的机器有光点流向中心 ----------------
const LIVE = { data: null, nodes: [], particles: [], t: 0 };
const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.floor(m / 60)} 小时前` : `${Math.floor(m / 1440)} 天前`; };

function initLive() {
  const cv = $('live'); const g = cv.getContext('2d'); const dpr = devicePixelRatio || 1;

      g.setLineDash([]);
      // 正在干活：光点流向中心
      if (nd.active.length && Math.random() < 0.12) LIVE.particles.push({ i, t: 0, v: 0.008 + Math.random() * 0.01, c: nd.color });
    });
    g.globalCompositeOperation = 'lighter';
    LIVE.particles = LIVE.particles.filter((p) => p.t < 1);
    for (const p of LIVE.particles) {
      p.t += p.v; const [x, y] = pos[p.i] || [cx, cyy];
      const px = x + (cx - x) * p.t; const py = y + (cyy - y) * p.t;
      g.fillStyle = p.c; g.globalAlpha = 0.9 * (1 - p.t * 0.6); g.beginPath(); g.arc(px, py, 2.4 * dpr, 0, 6.283); g.fill();
      g.globalAlpha = 0.2; g.beginPath(); g.arc(px, py, 7 * dpr, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    // 中心
    const pulse = 1 + 0.08 * Math.sin(LIVE.t / 18);
    const grd = g.createRadialGradient(cx, cyy, 0, cx, cyy, 46 * dpr * pulse);
    grd.addColorStop(0, 'rgba(158,197,244,.95)'); grd.addColorStop(0.35, 'rgba(57,135,229,.55)'); grd.addColorStop(1, 'rgba(57,135,229,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cyy, 46 * dpr * pulse, 0, 6.283); g.fill();
    g.font = `600 ${12 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`; g.textAlign = 'center'; g.fillStyle = '#0b1020';
    g.fillText('共享记忆', cx, cyy - 2 * dpr);
    g.font = `${10 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`; g.fillText(`${LIVE.data?.memories || ''} 条`, cx, cyy + 11 * dpr);
    // 机器
    LIVE.nodes.forEach((nd, i) => {
      const [x, y] = pos[i];
      if (nd.active.length) {
        const rr = (12 + 6 * Math.sin(LIVE.t / 12 + i)) * dpr;
        g.strokeStyle = nd.color; g.globalAlpha = 0.5; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(x, y, rr + 6 * dpr, 0, 6.283); g.stroke(); g.globalAlpha = 1;
      }
      g.fillStyle = nd.active.length ? nd.color : '#2a3247'; g.beginPath(); g.arc(x, y, 9 * dpr, 0, 6.283); g.fill();
      g.fillStyle = nd.syncOk ? '#0ca30c' : '#d03b3b'; g.beginPath(); g.arc(x + 8 * dpr, y - 8 * dpr, 3 * dpr, 0, 6.283); g.fill();
      const below = y > cyy;
      g.textAlign = 'center'; g.fillStyle = '#e8ecf6'; g.font = `600 ${11.5 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      const ly = below ? y + 24 * dpr : y - 18 * dpr;
      g.fillText(dev(nd.n), x, ly);
      g.font = `${10.5 * dpr}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`; g.fillStyle = 'rgba(163,174,203,.9)';
      const t0 = nd.tools[0];
      const sub = nd.active.length ? `${tool(nd.active[0][0])} · ${nd.active[0][1].project || '在干活'}` : t0 ? `${tool(t0[0])} ${ago(t0[1].last)}` : (nd.syncOk ? '在线' : '没同步');
      g.fillText(sub, x, ly + (below ? 13 : -13) * dpr);
    });
  };
  requestAnimationFrame(frame);
}

// ---------------- 巡航：一屏一个场景，自动切换；暂停后所有场景竖着排开 ----------------
const SCENES = [...document.querySelectorAll('.scene')];
const DWELL = 14000;
let sceneIdx = 0; let cruiseTimer = null;
$('dots').innerHTML = SCENES.map((_, i) => `<button data-i="${i}" aria-label="第 ${i + 1} 屏"></button>`).join('');
$('dots').querySelectorAll('button').forEach((b) => { b.onclick = () => { setCruise(true, +b.dataset.i); }; });
// 拓扑那一屏嵌的是控制台的拓扑页：第一次轮到它才加载；之后每次露出来让它按当前尺寸重排
const TOPO = $('topo');
function wakeTopo() {
  if (!TOPO.getAttribute('src')) TOPO.src = '/console?embed=1#/topology';
  else TOPO.contentWindow?.dispatchEvent(new Event('resize'));
}
function showScene(i) {
  sceneIdx = i;
  SCENES.forEach((s, k) => s.classList.toggle('on', k === i));
  document.body.classList.toggle('on-topo', SCENES[i].contains(TOPO));
  if (SCENES[i].contains(TOPO)) wakeTopo();
  $('dots').querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === i));
  requestAnimationFrame(() => { FITS.forEach((f) => f()); if (DATA) renderAll(); });
}
function setCruise(on, at) {
  document.body.classList.toggle('cruise', on);
  $('cruise').textContent = on ? '⏸ 暂停巡航' : '▶ 开始巡航';
  clearInterval(cruiseTimer); cruiseTimer = null;
  if (on) {
    showScene(at ?? sceneIdx);
    cruiseTimer = setInterval(() => { const n = (sceneIdx + 1) % SCENES.length; showScene(n); if (n === 0) refreshAll(); }, DWELL);
  } else { wakeTopo(); requestAnimationFrame(() => { FITS.forEach((f) => f()); if (DATA) renderAll(); }); }
}
$('cruise').onclick = () => setCruise(!document.body.classList.contains('cruise'));
$('fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.fullscreenElement) location.href = '/console'; });
async function refreshAll() {
  try { DATA = await (await fetch('/browse/viz-data')).json(); renderKpis(); renderAll(); } catch { /* 下次再刷 */ }
}

// ---------------- 启动 ----------------
function renderAll() { if (playing) stopReplay(false); renderCalendar(); renderRiver(); renderRank(); renderSankey(); renderPunch(); renderMilestones(); if (currentDay) loadDay(currentDay); }
fetch('/browse/viz-data').then((r) => r.json()).then((d) => {
  DATA = d;
  DEVICE = d.device_labels || {};
  TOP = d.projects.filter((x) => x.p !== '未写日志' && x.p !== '其他').slice(0, 7).map((x) => x.p);
  TOP.forEach((p, i) => { COLOR[p] = SLOTS[i]; });
  renderKpis();
  const days = Object.keys(d.days).sort();
  currentDay = d.days[todayStr()] ? todayStr() : days[days.length - 1];
  setCruise(true, 0);
  $('foot').textContent = `数据生成于 ${new Date(d.generated).toLocaleString(window.AMI18n ? AMI18n.locale : 'zh-CN', { hour12: false })}`;
  // 作息、大事记、回放用的每日摘要：第一次要扫一遍存档，可能要几秒
  $('punch').innerHTML = '<div class="empty">正在统计作息…</div>';
  fetch('/browse/viz-extra').then((r) => r.json()).then((x) => { EXTRA = x; renderPunch(); renderMilestones(); });
  if (location.hash === '#replay') setTimeout(() => { setCruise(false); startReplay(); }, 1500);
  // 星系和作战室
  fetch('/browse/viz-galaxy').then((r) => r.json()).then(initGalaxy);
  initLive(); loadLive(); setInterval(loadLive, 30000);
});
$('prev').onclick = () => currentDay && loadDay(addDays(currentDay, -1));
$('next').onclick = () => currentDay && loadDay(addDays(currentDay, 1));
$('today').onclick = () => loadDay(todayStr());
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => DATA && renderAll(), 250); });
</script>
